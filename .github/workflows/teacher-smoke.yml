name: Teacher PPO synthetic interface check

on:
  push:
    branches: [test/teacher-baseline-demo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teacher-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-demo.txt
      - name: Install CPU-only model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-demo.txt
      - name: Run the teacher's unchanged synthetic check
        run: python run_teacher_smoke.py --output output/teacher-smoke
      - name: Preserve the exact reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teacher-synthetic-interface-report
          path: |
            output/teacher-smoke/prepare-report.json
            output/teacher-smoke/smoke-report.json
            output/teacher-smoke/stdout.log
            output/teacher-smoke/stderr.log
          if-no-files-found: warn
          retention-days: 7
